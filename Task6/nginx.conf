http {
    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    # Зона хранения счётчиков запросов по IP-адресу клиента, лимит - 10 запросов в минуту
    limit_req_zone $binary_remote_addr zone=partner_limit:10m rate=10r/m;

    server {
        listen 80;

        location / {
            # При превышении лимита запрос сразу отклоняется (без очереди и задержки) с кодом 429
            limit_req zone=partner_limit;
            limit_req_status 429;

            proxy_pass http://backend_servers;
        }
    }
}
